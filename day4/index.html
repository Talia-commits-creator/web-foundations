
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Writing Counter</h1>
    <button id="theme-toggle" type="button">Toggle Theme</button>
  </header>

  <main>
    <section>
      <label for="note-text">Write your text below:</label>
      <textarea id="note-text" rows="10" placeholder="Start writing..."></textarea>

      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </section>
  </main>
</body>
</html>
